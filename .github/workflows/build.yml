name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.platform.name }} ${{ matrix.configuration }} ${{ matrix.platform.arch }}
    runs-on: ${{ matrix.platform.os }}

    container: ${{ matrix.platform.container || '' }}

    defaults:
      run:
        shell: ${{ matrix.platform.shell || 'bash -e {0}' }}

    strategy:
      fail-fast: false
      matrix:
        platform:
        - { name: Windows, os: windows-2025-vs2026,   arch: x86,   }
        - { name: Windows, os: windows-2025-vs2026,   arch: x64,   }
        - { name: Windows, os: windows-11-vs2026-arm, arch: ARM64, }

        configuration: [Debug, Release]

    steps:
    - uses: actions/checkout@main
      with:
        submodules: recursive

    - name: Run CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.configuration }} ${{ matrix.platform.flags }} --log-level VERBOSE

    - name: Run CMake Build
      id: cmake-build
      run: cmake --build build --config ${{ matrix.configuration }} --parallel ${{ matrix.platform.threads || 4 }}
